version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luminicent-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      # Mount Docker socket/pipe so backend container can manage simulation containers on host Docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=5000
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luminicent-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: luminicent-network
